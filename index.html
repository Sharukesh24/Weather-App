<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Finder 🌤️</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="default-bg" id="bodyBg">

    <!-- Dynamic Weather Background Animation Layers -->
    <div class="animation-layer" id="animationLayer"></div>

    <div class="weather-card">
        <h2>Live Weather 🌍</h2>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchBtn">search</button>
        </div>

        <div id="weather-Result" class="">
            <h2 id="cityName">City Name</h2>
            <h3 id="temp">--°C</h3>
            <p id="condition">Weather Condition</p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
